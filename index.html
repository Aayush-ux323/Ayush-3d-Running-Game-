
<script>
function drawProBackground(ctx, w, h, time = 0) {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.48);
  sky.addColorStop(0, "#38bdf8");
  sky.addColorStop(0.65, "#9be7f5");
  sky.addColorStop(1, "#ffe8ad");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  // Sun glow
  const sx = w * 0.78, sy = h * 0.18;
  const glow = ctx.createRadialGradient(sx, sy, 2, sx, sy, w * 0.19);
  glow.addColorStop(0, "rgba(255,240,160,0.7)");
  glow.addColorStop(1, "rgba(255,240,160,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h * 0.45);

  ctx.fillStyle = "#fff0a6";
  ctx.beginPath();
  ctx.arc(sx, sy, w * 0.045, 0, Math.PI * 2);
  ctx.fill();

  // Mountains
  function mountains(color, base, amp, shift) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, base);
    for (let x = 0; x <= w; x += w / 100) {
      const y = base - Math.abs(
        Math.sin(x / w * 8 + shift)
      ) * amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h * 0.49);
    ctx.lineTo(0, h * 0.49);
    ctx.closePath();
    ctx.fill();
  }

  mountains("#70a78a", h * 0.34, h * 0.045, 0);
  mountains("#3f806b", h * 0.40, h * 0.035, 1.8);

  // Ground
  ctx.fillStyle = "#c9b17a";
  ctx.fillRect(0, h * 0.43, w, h * 0.57);

  // Perspective road
  const horizon = h * 0.43;
  const bottom = h * 1.08;
  const tl = w * 0.425, tr = w * 0.575;
  const bl = -w * 0.03, br = w * 1.03;

  ctx.fillStyle = "#303b4b";
  ctx.beginPath();
  ctx.moveTo(tl, horizon);
  ctx.lineTo(tr, horizon);
  ctx.lineTo(br, bottom);
  ctx.lineTo(bl, bottom);
  ctx.closePath();
  ctx.fill();

  // Road edges
  ctx.strokeStyle = "#ffe6a3";
  ctx.lineWidth = Math.max(2, w * 0.006);
  ctx.beginPath();
  ctx.moveTo(tl, horizon);
  ctx.lineTo(bl, bottom);
  ctx.moveTo(tr, horizon);
  ctx.lineTo(br, bottom);
  ctx.stroke();

  // Moving lane markings
  ctx.strokeStyle = "rgba(230,240,255,0.75)";
  ctx.lineWidth = Math.max(2, w * 0.004);

  for (let i = 0; i < 12; i++) {
    const p = ((i / 12 + time * 0.25) % 1);
    const y = horizon + (bottom - horizon) * p * p;
    const dash = 3 + p * 25;
    const center = w / 2;

    ctx.beginPath();
    ctx.moveTo(center, y);
    ctx.lineTo(center, y + dash);
    ctx.stroke();
  }

  // Roadside trees
  function tree(x, y, size) {
    ctx.fillStyle = "#65452f";
    ctx.fillRect(
      x - size * 0.08, y, size * 0.16, size * 0.48
    );

    ctx.fillStyle = "#176b50";
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.lineTo(x - size * 0.46, y + size * 0.05);
    ctx.lineTo(x + size * 0.46, y + size * 0.05);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#289363";
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.75);
    ctx.lineTo(x - size * 0.32, y - size * 0.05);
    ctx.lineTo(x + size * 0.32, y - size * 0.05);
    ctx.closePath();
    ctx.fill();
  }

  for (let i = 0; i < 9; i++) {
    const p = (i + 1) / 10;
    const y = horizon + h * 0.57 * p;
    const size = w * (0.025 + p * 0.085);
    const roadHalf = w * (0.075 + p * 0.46);

    tree(w / 2 - roadHalf - size * 0.7, y, size);
    tree(w / 2 + roadHalf + size * 0.7, y, size);
  }

  // Soft screen shading
  const shade = ctx.createLinearGradient(0, 0, 0, h);
  shade.addColorStop(0, "rgba(255,255,255,0.02)");
  shade.addColorStop(1, "rgba(10,20,40,0.12)");
  ctx.fillStyle = shade;
  ctx.fillRect(0, 0, w, h);
}


// GOLDEN 3D-STYLE COIN
function drawGoldCoin(ctx, x, y, radius, rotation = 0) {
  ctx.save();
  ctx.translate(x, y);

  const squash = Math.max(0.16, Math.abs(Math.cos(rotation)));
  ctx.scale(squash, 1);

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.beginPath();
  ctx.ellipse(3, 5, radius, radius * 1.08, 0, 0,
    Math.PI * 2);
  ctx.fill();

  // Gold gradient
  const gold = ctx.createLinearGradient(
    -radius, -radius, radius, radius
  );
  gold.addColorStop(0, "#fff7a1");
  gold.addColorStop(0.35, "#ffc928");
  gold.addColorStop(0.7, "#ff9f0a");
  gold.addColorStop(1, "#ffe878");

  ctx.fillStyle = gold;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();

  // Coin outline
  ctx.strokeStyle = "#fff1a0";
  ctx.lineWidth = Math.max(1, radius * 0.12);
  ctx.stroke();

  // Rupee symbol
  ctx.fillStyle = "#fff7c2";
  ctx.font = `bold ${radius}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("₹", 0, 1);

  ctx.restore();
}
</script>
